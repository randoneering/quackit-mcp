name: Test and Lint

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5 # v5.5.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3 # v3.2.4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: uv run pytest tests/unit -v

      - name: Run integration tests (DuckDB only)
        run: uv run pytest tests/integration -v -k "not postgres"

      - name: Generate coverage report
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12' && secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5 # v5.4.3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3 # v3.2.4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/
